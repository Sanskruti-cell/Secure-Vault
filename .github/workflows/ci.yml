name: SecureVault CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Python ML Service Dependencies
        run: |
          cd backend/ml
          pip install -r requirements.txt

      - name: Verify Python ML Model & Heuristics
        run: |
          cd backend/ml
          python -c "import joblib, sklearn; print('ML dependencies loaded successfully')"

      - name: Run Cryptographic & Sharding Verification Tests
        env:
          PORT: 5002
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_min_32_characters_abcdef
          ENCRYPTION_MASTER_KEY: ci_test_master_key_32_chars_long!!
        run: |
          cd backend
          npm run test:crypto
          npm run test:sharding
          npm run test:all
